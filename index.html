<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 제3조 사수: 모바일 노치 및 상하단 바 화면 잘림 방지를 위한 뷰포트 Safe Area 대응 선언 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>프리미엄 국궁 탄도학 시뮬레이터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 메인 모바일 인터페이스 콘텐트 컨테이너 -->
  <div class="app-container">
    
    <!-- --------------------------------------------------------------------------
         1. 최상단 프리미엄 실시간 캔버스 시각화 디스플레이 구역 (Canvas Screen)
         -------------------------------------------------------------------------- -->
    <div class="canvas-container">
      <canvas id="simCanvas"></canvas>
      
      <!-- 시점 변경 세그먼트 가로 컨트롤러 컴포넌트 -->
      <div class="segmented-control">
        <button class="segment-btn active" onclick="changeView('side', this)">측면도</button>
        <button class="segment-btn" onclick="changeView('front', this)">정면도</button>
        <button class="segment-btn" onclick="changeView('top', this)">평면도</button>
      </div>

      <!-- 시인성이 높은 테크니컬 라이팅 네온 발광 가이드 마커 (.recording) -->
      <div class="live-indicator recording">
        <span class="dot"></span>
        <span class="label">LIVE ENGINE ACTIVE</span>
      </div>
    </div>
    <!-- --------------------------------------------------------------------------
         2. 상시 노출형 수치 설정 패널 컴포넌트 구역 (Input Parameter Sheets)
         -------------------------------------------------------------------------- -->
    <div class="settings-container">
      
      <!-- [SHEET 1] 기본 사격 제원 설정 탭 패널 -->
      <div id="sheet-basic" class="tab-panel active">
        <div class="input-grid">
          <div class="input-group">
            <label for="velocity">발사 초기 속도 (m/s)</label>
            <input type="number" id="velocity" value="55.0" step="0.5" min="10" max="150">
          </div>
          <div class="input-group">
            <label for="angle">수직 발사 고각 (도)</label>
            <input type="number" id="angle" value="28.5" step="0.1" min="0" max="85">
          </div>
          <div class="input-group">
            <label for="yawAngle">수평 사격 방위각 (도)</label>
            <input type="number" id="yawAngle" value="0.0" step="0.1" min="-45" max="45">
          </div>
          <div class="input-group">
            <label for="launchHeight">사대 시작 높이 (m)</label>
            <input type="number" id="launchHeight" value="1.50" step="0.05" min="0" max="10">
          </div>
        </div>
      </div>

      <!-- [SHEET 2] 공기역학 및 궁시 제원 설정 탭 패널 -->
      <div id="sheet-aero" class="tab-panel">
        <div class="input-grid">
          <div class="input-group">
            <label for="dragCoeff">유체 저항 항력계수 (Cd)</label>
            <input type="number" id="dragCoeff" value="0.33" step="0.01" min="0.05" max="1.5">
          </div>
          <div class="input-group">
            <label for="liftCoeff">비행 복원 양력계수 (Cl)</label>
            <input type="number" id="liftCoeff" value="0.04" step="0.01" min="-0.5" max="0.5">
          </div>
          <div class="input-group">
            <label for="weight">화살 전체 무게 (g)</label>
            <input type="number" id="weight" value="24.5" step="0.1" min="5" max="100">
          </div>
          <div class="input-group">
            <label for="diameter">화살 전면 지름 (mm)</label>
            <input type="number" id="diameter" value="6.5" step="0.1" min="3" max="20">
          </div>
        </div>
      </div>

      <!-- [SHEET 3] 환경 변수 및 표적 설정 탭 패널 -->
      <div id="sheet-env" class="tab-panel">
        <div class="input-grid">
          <div class="input-group">
            <label for="targetHeight">국궁 과녁 중심 높이 (m)</label>
            <input type="number" id="targetHeight" value="1.33" step="0.01" min="0" max="5">
          </div>
          <div class="input-group">
            <label for="windX">전방 종풍/역풍 (m/s)</label>
            <input type="number" id="windX" value="0.0" step="0.1" min="-20" max="20">
          </div>
          <div class="input-group">
            <label for="windY">측면 좌/우 횡풍 (m/s)</label>
            <input type="number" id="windY" value="0.0" step="0.1" min="-20" max="20">
          </div>
          <div class="input-group">
            <label for="airDensity">대기 공기 밀도 (kg/m³)</label>
            <input type="number" id="airDensity" value="1.225" step="0.001" min="0.5" max="2.0">
          </div>
        </div>
      </div>

    </div>
    <!-- --------------------------------------------------------------------------
         3. 완전 투명 크리스탈 패널 마감 핵심 연산 결과 데이터 출력 구역 (Results Board)
         -------------------------------------------------------------------------- -->
    <div class="results-board-panel perfect-level">
      <div class="results-grid">
        <div class="result-card">
          <span class="card-label">최대 도달 거리</span>
          <!-- 제2조/제4조 완벽 동기화: 자바스크립트가 추적 매핑할 물리 ID 원본 주입 -->
          <div class="card-value-wrapper">
            <strong id="resMaxDistance" class="tabular-nums">0.00</strong>
            <span class="card-unit">m</span>
          </div>
        </div>
        <div class="result-card">
          <span class="card-label">최고 정점 높이</span>
          <div class="card-value-wrapper">
            <strong id="resMaxHeight" class="tabular-nums">0.00</strong>
            <span class="card-unit">m</span>
          </div>
        </div>
        <div class="result-card">
          <span class="card-label">탄도 측면 편차</span>
          <div class="card-value-wrapper">
            <strong id="resLateralDeviation" class="tabular-nums">0.00</strong>
            <span class="card-unit">m</span>
          </div>
        </div>
        <div class="result-card">
          <span class="card-label">총 화살 비행 시간</span>
          <div class="card-value-wrapper">
            <strong id="resFlightTime" class="tabular-nums">0.00</strong>
            <span class="card-unit">초</span>
          </div>
        </div>
        <div class="result-card">
          <span class="card-label">최종 충돌 속도</span>
          <div class="card-value-wrapper">
            <strong id="resImpactVelocity" class="tabular-nums">0.00</strong>
            <span class="card-unit">m/s</span>
          </div>
        </div>
        <div class="result-card">
          <span class="card-label">피격 탄도 에너지</span>
          <div class="card-value-wrapper">
            <strong id="resImpactEnergy" class="tabular-nums">0.00</strong>
            <span class="card-unit">J</span>
          </div>
        </div>
      </div>
    </div>

    <!-- --------------------------------------------------------------------------
         4. 하단 프리미엄 내비게이션 인터페이스 탭바 메커니즘 (Bottom Tab Bar)
         -------------------------------------------------------------------------- -->
    <div class="tab-bar">
      <div class="tab-item active" onclick="switchTab('basic', this)">
        <span class="tab-icon">🎯</span>
        <span class="tab-label">기본 사격</span>
      </div>
      <div class="tab-item" onclick="switchTab('aero', this)">
        <span class="tab-icon">🚀</span>
        <span class="tab-label">공기역학</span>
      </div>
      <div class="tab-item" onclick="switchTab('env', this)">
        <span class="tab-icon">🌬️</span>
        <span class="tab-label">환경과녁</span>
      </div>
    </div>

  </div>

  <!-- 비계층 구조 독립형 코어 스크립트 순차적 로드 파이프라인 구성 -->
  <script src="physics.js"></script>
  <script src="ui.js"></script>
</body>
</html>
