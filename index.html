<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Trajectory Simulator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 좌우 분할 멀티 모니터 배치를 위한 기존 레이아웃 가중치 오버라이딩 */
        .split-sim-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 8px;
            padding: 4px;
            box-sizing: border-box;
        }
        .canvas-box-main {
            flex: 1.3;
            height: 100%;
            position: relative;
        }
        .canvas-box-target {
            flex: 1;
            height: 100%;
            background: #fafafa;
            border-left: 1px solid rgba(0,0,0,0.05);
            position: relative;
        }
    </style>
</head>
<body>

<!-- 상단 75% 영역: 메인 스크린 및 가로 분할 듀얼 캔버스 모니터 -->
<div class="main-screen" style="height: 75vh;">
    <h1>Arrow Trajectory</h1>
    
    <div class="segmented-control">
        <button class="segment-btn" onclick="changeView('front', this)">정면</button>
        <button class="segment-btn active" onclick="changeView('side', this)">측면</button>
        <button class="segment-btn" onclick="changeView('top', this)">평면</button>
    </div>
    
    <div class="sim-container" style="overflow: hidden;">
        <div class="split-sim-wrapper">
            <!-- [좌측 모니터] 시점별 메인 물리 엔진 트래킹 화면 -->
            <div class="canvas-box-main">
                <canvas id="simCanvas"></canvas>
            </div>
            <!-- [우측 모니터] 신설: 실축 비율 정면 과녁 및 빗나간 위치 플로팅 화면 -->
            <div class="canvas-box-target">
                <canvas id="targetCanvas"></canvas>
            </div>
        </div>
        <div class="floating-actions">
            <button class="fire-btn" onclick="fireArrow()">🏹 발사</button>
        </div>
    </div>
</div>

<!-- 하단 25% 영역: 상시 노출형 설정 및 결과 패널 컨테이너 -->
<div id="panel-container">
    
    <!-- [탭 1] 화살 설정 -->
    <div class="fixed-panel active" id="panel-arrow">
        <div class="panel-title">화살 설정</div>
        <div class="form-grid">
            <div class="form-group"><label>화살 무게</label><div class="input-wrapper"><input type="number" id="weight" value="25"><span class="unit">g</span></div></div>
            <div class="form-group"><label>화살 직경</label><div class="input-wrapper"><input type="number" id="diameter" value="5.5" step="0.1"><span class="unit">mm</span></div></div>
            <div class="form-group"><label>항력 계수</label><div class="input-wrapper"><input type="number" id="dragCoeff" value="0.35" step="0.01"><span class="unit">cd</span></div></div>
            <div class="form-group"><label>양력 계수</label><div class="input-wrapper"><input type="number" id="liftCoeff" value="0.05" step="0.01"><span class="unit">cl</span></div></div>
        </div>
    </div>

    <!-- [탭 2] 사법 설정 -->
    <div class="fixed-panel" id="panel-method">
        <div class="panel-title">사법 설정</div>
        <div class="form-grid">
            <div class="form-group"><label>발시 각도</label><div class="input-wrapper"><input type="number" id="angle" value="30"><span class="unit">°</span></div></div>
            <div class="form-group"><label>초기 속도</label><div class="input-wrapper"><input type="number" id="velocity" value="50"><span class="unit">m/s</span></div></div>
            <div class="form-group"><label>수평 각도</label><div class="input-wrapper"><input type="number" id="yawAngle" value="0"><span class="unit">°</span></div></div>
            <div class="form-group"><label>발시 높이</label><div class="input-wrapper"><input type="number" id="launchHeight" value="1.5" step="0.1"><span class="unit">m</span></div></div>
        </div>
    </div>

    <!-- [탭 3] 환경 설정 -->
    <div class="fixed-panel" id="panel-env">
        <div class="panel-title">환경 설정</div>
        <div class="form-grid">
            <div class="form-group">
                <label>종풍 (맞/뒷바람)</label>
                <div class="input-wrapper">
                    <input type="text" id="windX" value="0" inputmode="decimal" pattern="^-?[0-9]*\.?[0-9]*$" oninput="this.value = this.value.replace(/[^0-9.-]/g, '').replace(/(\..*)\./g, '$1').replace(/(?!^)-/g, '');">
                    <span class="unit">m/s</span>
                </div>
            </div>
            <div class="form-group">
                <label>횡풍 (옆바람)</label>
                <div class="input-wrapper">
                    <input type="text" id="windY" value="0" inputmode="decimal" pattern="^-?[0-9]*\.?[0-9]*$" oninput="this.value = this.value.replace(/[^0-9.-]/g, '').replace(/(\..*)\./g, '$1').replace(/(?!^)-/g, '');">
                    <span class="unit">m/s</span>
                </div>
            </div>
            <div class="form-group"><label>과녁 고도차</label><div class="input-wrapper"><input type="number" id="targetHeight" value="1.3" step="0.1"><span class="unit">m</span></div></div>
            <div class="form-group"><label>공기 밀도</label><div class="input-wrapper"><input type="number" id="airDensity" value="1.225" step="0.001"><span class="unit">kg/m³</span></div></div>
        </div>
    </div>

    <!-- [탭 4] 비행 결과 -->
    <div class="fixed-panel" id="panel-result">
        <div class="panel-title">비행 결과 분석</div>
        <div class="form-grid grid-2col">
            <div class="form-group"><label>최대 거리</label><div class="result-value" id="resMaxDist">0.00 m</div></div>
            <div class="form-group"><label>최대 높이</label><div class="result-value" id="resMaxHeight">0.00 m</div></div>
            <div class="form-group"><label>측면 편차</label><div class="result-value" id="resSideDev">0.00 m</div></div>
            <div class="form-group"><label>비행 시간</label><div class="result-value" id="resFlightTime">0.00 s</div></div>
            <div class="form-group"><label>충돌 속도</label><div class="result-value" id="resImpactVel">0.00 m/s</div></div>
            <div class="form-group"><label>충돌 에너지</label><div class="result-value" id="resImpactEnergy">0.00 J</div></div>
        </div>
    </div>

</div>

<!-- 맨 하단 메뉴 전환 탭바 -->
<div class="tab-bar">
    <button class="tab-item active" onclick="switchPanel('arrow')"><span class="tab-icon">🏹</span><span>화살 설정</span></button>
    <button class="tab-item" onclick="switchPanel('method')"><span class="tab-icon">🎯</span><span>사법 설정</span></button>
    <button class="tab-item" onclick="switchPanel('env')"><span class="tab-icon">🌍</span><span>환경 설정</span></button>
    <button class="tab-item" onclick="switchPanel('result')"><span class="tab-icon">📊</span><span>비행 결과</span></button>
</div>

<script src="ui.js"></script>
<script src="physics.js"></script>
</body>
</html>
