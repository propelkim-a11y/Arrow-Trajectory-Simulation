<!-- [Part 1: 갤럭시 One UI 3축 통합 고속 로딩 아키텍처 - index.html] -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Jumong-jeong - Gungdo Simulator</title>
    <script src="https://cloudflare.com" integrity="sha512-ZwR1/gSZMwktIZPhxtchPMn3KGf4QvWj63AhTeTUytYms5giKuADrqWxgwiqa9ONY9OTaAMgx60VJvOATHLI9w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        :root {
            --oneui-bg: #000000;
            --oneui-card: #121214;
            --oneui-border: rgba(255, 255, 255, 0.08);
            --oneui-accent: #60A5FA;
            --oneui-success: #34D399;
            --oneui-destructive: #F87171;
            --oneui-text-main: #F3F4F6;
            --oneui-text-secondary: #9CA3AF;
            --safe-top: env(safe-area-inset-top, 24px);
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans KR", sans-serif;
            font-display: swap;
            background-color: var(--oneui-bg) !important;
            color: var(--oneui-text-main) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: calc(var(--safe-top) + 56px);
            padding-bottom: calc(var(--safe-bottom) + 340px);
        }

        header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #000000;
            border-bottom: 1px solid var(--oneui-border);
            z-index: 1000;
            padding-top: var(--safe-top);
            padding-left: 20px;
            box-sizing: content-box;
        }

        header h1 {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        main {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            height: calc(100vh - var(--safe-top) - 56px - var(--safe-bottom) - 340px);
            -webkit-overflow-scrolling: touch;
        }

        .oneui-card {
            background: var(--oneui-card);
            border: 1px solid var(--oneui-border);
            border-radius: 24px;
            padding: 16px;
        }

        .dashboard-header {
            display: grid;
            grid-template-columns: 85px 1fr;
            gap: 16px;
            align-items: center;
        }

        #windCanvas {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 50%;
            border: 1px solid var(--oneui-border);
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums !important;
            font-feature-settings: "tnum" !important;
        }

        .chart-container {
            height: 180px;
            position: relative;
            width: 100%;
        }

        .oneui-tab-container {
            display: flex;
            border-bottom: 2px solid var(--oneui-border);
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--oneui-text-secondary);
            font-size: 15px;
            font-weight: 500;
            padding: 12px 0;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: color 0.2s ease;
        }

        .tab-btn.active {
            color: var(--oneui-accent);
            font-weight: 600;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--oneui-accent);
        }

        .oneui-bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #161618;
            border-top: 1px solid var(--oneui-border);
            padding: 8px 20px calc(var(--safe-bottom) + 12px) 20px;
            z-index: 900;
            border-radius: 28px 28px 0 0;
            box-shadow: 0 -8px 32px rgba(0,0,0,0.6);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            margin: 0 auto 12px auto;
        }

        .control-scroll-area {
            max-height: 250px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .control-scroll-area.active {
            display: flex;
        }

        .oneui-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--oneui-border);
            border-radius: 16px;
            padding: 12px 16px;
        }

        .oneui-row label {
            font-size: 15px;
            color: var(--oneui-text-main);
            font-weight: 400;
        }

        input[type="number"] {
            width: 85px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--oneui-border);
            border-radius: 10px;
            padding: 8px 12px;
            color: #FFFFFF;
            font-size: 15px;
            text-align: right;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .oneui-slider-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--oneui-border);
            border-radius: 16px;
            padding: 14px 16px;
        }

        .oneui-slider-meta {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .oneui-slider-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--oneui-accent);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        .oneui-slider-val {
            font-size: 15px;
            font-weight: 500;
            color: var(--oneui-accent);
            width: 50px;
            text-align: right;
        }
    </style>
</head>
<body>

<main>
    <div class="oneui-card dashboard-header">
        <canvas id="windCanvas" width="85" height="85"></canvas>
        <div style="width: 100%; height: 110px;">
            <canvas id="frontViewChart"></canvas>
        </div>
    </div>
    <div class="oneui-card">
        <div class="chart-container">
            <canvas id="sideViewChart"></canvas>
        </div>
    </div>
    <div class="oneui-card">
        <div class="chart-container">
            <canvas id="topViewChart"></canvas>
        </div>
    </div>
</main>

<div class="oneui-bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="oneui-tab-container">
        <button id="btnSpecs" class="tab-btn active" onclick="switchTab('specsTab')">화살 사양</button>
        <button id="btnEnv" class="tab-btn" onclick="switchTab('envTab')">환경 변수</button>
    </div>
    
    <div id="specsTab" class="control-scroll-area active">
        <div class="oneui-row"><label>초기 속도 (m/s)</label><input type="number" id="v0" value="60" min="30" max="100" step="1"></div>
        <div class="oneui-row"><label>화살 무게 (g)</label><input type="number" id="m_g" value="26.25" min="15" max="40" step="0.05"></div>
        <div class="oneui-row"><label>화살 직경 (mm)</label><input type="number" id="d_mm" value="8.0" min="5" max="15" step="0.1"></div>
        <div class="oneui-row"><label>Vertical 발사각 (°)</label><input type="number" id="theta_deg" value="13.0" min="0" max="45" step="0.1"></div>
        <div class="oneui-row"><label>Horizontal 편각 (°)</label><input type="number" id="phi_deg" value="-0.5" min="-5" max="5" step="0.1"></div>
        <div class="oneui-row"><label>출전 높이 (m)</label><input type="number" id="h0" value="1.5" min="0" max="5" step="0.1"></div>
    </div>
    
    <div id="envTab" class="control-scroll-area">
        <div class="oneui-slider-box">
