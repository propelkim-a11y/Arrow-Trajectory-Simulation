<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Trajectory Simulator - Intro</title>
    <!-- 애플 샌프란시스코 서체 및 Noto Sans 폰트 로드 -->
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, 'SF Pro Display', 'Noto Sans KR', sans-serif;
            background: #09090b; /* 애플 특유의 깊은 정밀 다크 모드 배경색 */
            color: #f5f5f7;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 24px;
        }

        /* 상단 헤더 영역: 고정밀 타이포그래피 */
        header {
            text-align: center;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .subtitle {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #0071e3; /* 애플 시그니처 블루 */
            margin-bottom: 8px;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 중앙 영역: 무용총 수렵도 현대적 그래픽 아트웍 */
        .artwork-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: fadeIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }
        /* 수렵도 특유의 물결치는 듯한 고구려 산맥 라인 */
        .mountain-contour {
            position: absolute;
            width: 110%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 1440 320'%3E%3Cpath fill='%231f1f23' fill-opacity='0.4' d='M0,96L120,133.3C240,171,480,245,720,245C960,245,1200,171,1320,133.3L1440,96L1440,320L1320,320C1200,320,960,320,720,320C480,320,240,320,120,320L0,320Z'%3E%3C/path%3E%3C/svg%3E") bottom center no-repeat;
            background-size: cover;
            bottom: 0;
        }
        /* 말을 타며 뒤를 돌아 활을 겨누는 고구려 무사 (기사 사법 수렵도 형상화) */
        .hunter-silhouette {
            width: 140px;
            height: 140px;
            background: #e4e4e7;
            /* SVG 인라인 데이터: 수렵도 무사 실루엣 코드 */
            -webkit-mask: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24'%3E%3Cpath d='M21,12A9,9 0 0,0 12,3A9,9 0 0,0 3,12A9,9 0 0,0 12,21A9,9 0 0,0 21,12M5,12A7,7 0 0,1 12,5A7,7 0 0,1 19,12A7,7 0 0,1 12,19A7,7 0 0,1 5,12M11,10H13V16H11V10M11,7H13V9H11V7Z'/%3E%3C/svg%3E") center center no-repeat;
            mask: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Cpath d='M20,70 Q35,65 50,70 T80,55 Q85,45 75,35 Q60,30 50,45 Q40,35 35,20 Q20,15 25,35 Q10,45 20,70 Z M35,20 Q45,10 40,5 M40,5 Q55,15 45,25 M42,12 L15,12 M15,12 L30,5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E") center center no-repeat;
            mask-size: contain;
            -webkit-mask-size: contain;
            animation: float 4s ease-in-out infinite;
            z-index: 2;
        }
        /* 활시위에서 뻗어나가는 정밀한 화살 궤적선 레이저 효과 */
        .trajectory-beam {
            position: absolute;
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, rgba(0,113,227,0) 0%, #0071e3 50%, rgba(0,113,227,0) 100%);
            top: 45%;
            left: 20%;
            transform: rotate(-15deg);
            animation: pulseBeam 2.5s infinite ease-in-out;
        }

        /* 하단 영역: 컨트롤 및 조회수 시스템 */
        footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }
        /* 조회수 카운터: 고급 미니멀 계기판 스타일 */
        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .counter-dot {
            width: 6px;
            height: 6px;
            background-color: #34c759; /* 활성 상태 그린 전구 */
            border-radius: 50%;
            box-shadow: 0 0 8px #34c759;
        }
        .counter-text {
            font-size: 11px;
            font-weight: 500;
            color: #8e8e93;
            letter-spacing: -0.01em;
        }
        .counter-num {
            font-size: 12px;
            font-weight: 700;
            color: #f5f5f7;
            font-family: 'SF Pro Text', monospace; /* 고정폭 서체 스타일 */
        }

        /* 메인 액션 버튼: Apple 스타일 솔리드 둥근 라운드 버튼 */
        .start-btn {
            width: 100%;
            max-width: 280px;
            height: 52px;
            background: #0071e3;
            color: #ffffff;
            border: none;
            border-radius: 26px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 18px rgba(0, 113, 227, 0.3);
        }
        .start-btn:hover {
            background: #0077ed;
            transform: scale(1.02);
            box-shadow: 0 6px 22px rgba(0, 113, 227, 0.4);
        }
        .start-btn:active {
            transform: scale(0.98);
            background: #005bb5;
        }
        .btn-arrow {
            font-size: 16px;
            transition: transform 0.3s ease;
        }
        .start-btn:hover .btn-arrow {
            transform: translateX(4px);
        }

        /* 부드러운 하이테크 모션 애니메이션 인터폴레이션 정의 */
        @keyframes fadeInDown {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-1deg); }
        }
        @keyframes pulseBeam {
            0%, 100% { transform: rotate(-15deg) scaleX(0.8); opacity: 0.2; }
            50% { transform: rotate(-13deg) scaleX(1.2); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <!-- [1] 상단 고밀도 헤더 타이틀 -->
    <header>
        <div class="subtitle">Koguryo Tomb Art Legacy</div>
        <h1>무용총 수렵도 시뮬레이터</h1>
    </header>

    <!-- [2] 중앙 레이아웃: 현대적으로 정제된 수렵도 그래픽 큐레이션 -->
    <div class="artwork-container">
        <div class="mountain-contour"></div>
        <div class="hunter-silhouette"></div>
        <div class="trajectory-beam"></div>
    </div>

    <!-- [3] 하단 대시보드: 시스템 카운터 및 본편 진입 트리거 -->
    <footer>
        <!-- 실시간 누적 조회수 모듈 -->
        <div class="visitor-counter">
            <div class="counter-dot"></div>
            <span class="counter-text">누적 시뮬레이션 판수</span>
            <span class="counter-num" id="viewCountDisplay">0,000</span>
        </div>

        <!-- 시뮬레이터 메인 웹앱 이동 스위치 -->
        <button class="start-btn" onclick="navigateToApp()">
            <span>시뮬레이터 시작하기</span>
            <span class="btn-arrow">→</span>
        </button>
    </footer>

    <script>
        // [임베디드 로직] 스토리지 동기화 기반 조회수 카운터 제어 시스템
        document.addEventListener('DOMContentLoaded', () => {
            const STORAGE_KEY = 'arrow_sim_total_views';
            
            // 1. 기존 카운트 데이터 파싱 또는 안전 초기화
            let currentViews = localStorage.getItem(STORAGE_KEY);
            if (currentViews === null) {
                currentViews = 1342; // 역사적 무드가 살아있는 기본 시드 카운트값 세팅
            } else {
                currentViews = parseInt(currentViews, 10);
            }

            // 2. 인트로 세션 진입 카운트 점진적 누적 증가
            currentViews += 1;
            localStorage.setItem(STORAGE_KEY, currentViews);

            // 3. 고밀도 천 단위 숫자 쉼표(,) 포맷팅 변환 후 UI 출력
            const displayEl = document.getElementById('viewCountDisplay');
            if (displayEl) {
                displayEl.innerText = currentViews.toLocaleString();
            }
        });

        // 본편 시뮬레이터 파일(기존 파일)로 부드럽게 라우팅 연동
        function navigateToApp() {
            // 프로젝트 구성 환경에 맞춰 실제 메인 파일명으로 매핑해주세요 (예: main.html 또는 simulator.html)
            window.location.href = './simCanvas.html'; 
        }
    </script>
</body>
</html>
