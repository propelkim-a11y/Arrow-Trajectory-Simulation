<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Trajectory Simulator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 💡 인트로 전용 내부 스타일 셋업 */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 1;
        }
        .intro-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .intro-logo {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
        }
        .logo-target {
            width: 80px;
            height: 80px;
            border: 12px solid #ff3b30;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.3);
        }
        .logo-bullseye {
            width: 24px;
            height: 24px;
            background: #1c1c1e;
            border-radius: 50%;
        }
        .logo-arrow {
            position: absolute;
            font-size: 46px;
            bottom: -8px;
            right: -10px;
            transform: rotate(-10deg);
            animation: arrowWiggle 2s infinite ease-in-out;
        }
        @keyframes arrowWiggle {
            0%, 100% { transform: rotate(-10deg) translate(0, 0); }
            50% { transform: rotate(-5deg) translate(4px, -4px); }
        }
        .intro-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .intro-subtitle {
            color: #8e8e93;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 30px;
        }
        .intro-loader {
            width: 140px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-bar {
            width: 100%;
            height: 100%;
            background: #0071e3;
            border-radius: 2px;
            transform: translateX(-100%);
            animation: loadProgress 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes loadProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

<!-- 💡 [신설] 앱 구동 시 가장 먼저 전개되는 국궁 인트로 오버레이 레이어 -->
<div id="intro-overlay">
    <div class="intro-content">
        <div class="intro-logo">
            <div class="logo-target">
                <div class="logo-bullseye"></div>
            </div>
            <div class="logo-arrow">🏹</div>
        </div>
        <h2 class="intro-title">국궁 탄도 시뮬레이터</h2>
        <p class="intro-subtitle">Arrow Trajectory Simulator</p>
        <div class="intro-loader">
            <div class="loader-bar"></div>
        </div>
    </div>
</div>

<!-- 상단 영역 메인 스크린 및 시뮬레이터 캔버스 -->
<div class="main-screen">
    <h1>Arrow Trajectory</h1>
    
    <div class="segmented-control">
        <button class="segment-btn" onclick="changeView('front', this)">정면</button>
        <button class="segment-btn active" onclick="changeView('side', this)">측면</button>
        <button class="segment-btn" onclick="changeView('top', this)">평면</button>
        <button class="segment-btn" onclick="changeView('target', this)">과녁</button>
    </div>
    
    <div class="sim-container">
        <canvas id="simCanvas"></canvas>
        <button id="draggableFireBtn" class="fire-btn">발사</button>
    </div>
</div>

<!-- 하단 영역 라운드 카드형 설정 및 결과 패널 컨테이너 -->
<div id="panel-container">
    
    <!-- [탭 1] 화살 설정 -->
    <div class="fixed-panel active" id="panel-arrow">
        <div class="panel-card">
            <div class="panel-title">화살 설정</div>
            <div class="form-grid">
                <div class="form-group"><label>화살 무게</label><div class="input-wrapper"><input type="number" id="weight" value="25"><span class="unit">g</span></div></div>
                <div class="form-group"><label>화살 직경</label><div class="input-wrapper"><input type="number" id="diameter" value="5.5" step="0.1"><span class="unit">mm</span></div></div>
                <div class="form-group"><label>항력 계수</label><div class="input-wrapper"><input type="number" id="dragCoeff" value="0.35" step="0.01"><span class="unit">cd</span></div></div>
                <div class="form-group"><label>양력 계수</label><div class="input-wrapper"><input type="number" id="liftCoeff" value="0.05" step="0.01"><span class="unit">cl</span></div></div>
            </div>
        </div>
    </div>

    <!-- [탭 2] 사법 설정 -->
    <div class="fixed-panel" id="panel-method">
        <div class="panel-card">
            <div class="panel-title">사법 설정</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>발시 각도</label>
                    <div class="input-wrapper">
                        <input type="text" id="angle" value="30" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
                        <span class="unit">°</span>
                    </div>
                </div>
                <div class="form-group"><label>초기 속도</label><div class="input-wrapper"><input type="number" id="velocity" value="50"><span class="unit">m/s</span></div></div>
                <div class="form-group">
                    <label>수평 각도</label>
                    <div class="input-wrapper">
                        <input type="text" id="yawAngle" value="0" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
                        <span class="unit">°</span>
                    </div>
                </div>
                <div class="form-group"><label>발시 높이</label><div class="input-wrapper"><input type="number" id="launchHeight" value="1.5" step="0.1"><span class="unit">m</span></div></div>
            </div>
        </div>
    </div>

    <!-- [탭 3] 환경 설정 -->
    <div class="fixed-panel" id="panel-env">
        <div class="panel-card">
            <div class="panel-title">환경 설정</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>종풍</label>
                    <div class="input-wrapper">
                        <input type="text" id="windX" value="0" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
                        <span class="unit">m/s</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>횡풍</label>
                    <div class="input-wrapper">
                        <input type="text" id="windY" value="0" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
                        <span class="unit">m/s</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>과녁 고도차</label>
                    <div class="input-wrapper">
                        <input type="text" id="targetHeight" value="1.3" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
                        <span class="unit">m</span>
                    </div>
                </div>
                <div class="form-group"><label>공기 밀도</label><div class="input-wrapper"><input type="number" id="airDensity" value="1.225" step="0.001"><span class="unit">kg/m³</span></div></div>
            </div>
        </div>
    </div>

    <!-- [탭 4] 비행 결과 -->
    <div class="fixed-panel" id="panel-result">
        <div class="panel-card">
            <div class="panel-title">비행 결과 분석</div>
            <div class="form-grid">
                <div class="form-group"><label>최대 거리</label><div class="result-value" id="resMaxDist">0.00 m</div></div>
                <div class="form-group"><label>최대 높이</label><div class="result-value" id="resMaxHeight">0.00 m</div></div>
                <div class="form-group"><label>측면 편차</label><div class="result-value" id="resSideDev">0.00 m</div></div>
                <div class="form-group"><label>비행 시간</label><div class="result-value" id="resFlightTime">0.00 s</div></div>
                <div class="form-group"><label>충돌 속도</label><div class="result-value" id="resImpactVel">0.00 m/s</div></div>
                <div class="form-group"><label>충돌 에너지</label><div class="result-value" id="resImpactEnergy">0.00 J</div></div>
            </div>
        </div>
    </div>

</div>

<!-- 고정 저작권 표시 영역 -->
<div id="app-copyright">
    Copyright © 2026 해현-활터왔소. All Rights Reserved.
</div>

<!-- 맨 하단 메뉴 전환 탭바 -->
<div class="tab-bar">
    <button class="tab-item active" onclick="switchPanel('arrow')"><span class="tab-icon">🎯</span><span>화살 설정</span></button>
    <button class="tab-item" onclick="switchPanel('method')"><span class="tab-icon">🏹</span><span>사법 설정</span></button>
    <button class="tab-item" onclick="switchPanel('env')"><span class="tab-icon">🐓</span><span>환경 설정</span></button>
    <button class="tab-item" onclick="switchPanel('result')"><span class="tab-icon">📊</span><span>비행 결과</span></button>
</div>

<script src="ui.js"></script>
<script src="physics.js"></script>

<!-- 💡 인트로 제어 구동 자바스크립트 -->
<script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const overlay = document.getElementById('intro-overlay');
            if (overlay) {
                overlay.style.opacity = '0';
                overlay.style.transition = 'opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
        setTimeout(() => {
            overlay.remove();
        }, 600);
    }, 2200);
});
