<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화살 탄도 시뮬레이터</title>
    <style>
        /* 기본 스타일 초기화 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* 전체 컨테이너 (스케치 구조를 감싸는 틀) */
        .app-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }

        /* 공통 탭 스타일 */
        .tab-container { display: flex; gap: 5px; }
        .tab { padding: 8px 24px; border: 2px solid #000; border-bottom: none; background: #fff; cursor: pointer; font-weight: bold; font-size: 14px; }
        .tab.active { background: #e0e0e0; } /* 선택된 탭 표시 */

        /* 공통 메인 박스 스타일 */
        .content-box { border: 3px solid #000; background: #fff; width: 100%; min-height: 250px; position: relative; }

        /* --- 상단 시뮬레이션 영역 --- */
        .sim-section { display: flex; flex-direction: column; }
        .sim-display { height: 400px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        /* 시뮬레이션용 캔버스 크기 고정 */
        canvas { width: 100%; height: 100%; background: #fafafa; }

        /* --- 하단 설정 영역 --- */
        .control-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .control-group { display: flex; flex-direction: column; }
        .control-content { padding: 20px; height: 100%; display: flex; flex-direction: column; gap: 12px; }

        /* 입력창 폼 스타일 */
        .form-group { display: flex; justify-content: space-between; align-items: center; }
        .form-group label { font-weight: bold; font-size: 14px; }
        .form-group input { width: 100px; padding: 5px; border: 1px solid #ccc; text-align: right; }
        
        /* 발사 버튼 (환경변수 아래나 여백에 배치 가능) */
        .fire-btn { grid-column: span 2; padding: 15px; background: #000; color: #fff; font-size: 18px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .fire-btn:hover { background: #333; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- [상단 영역] 시점 선택 및 시뮬레이션 화면 -->
        <div class="sim-section">
            <div class="tab-container">
                <div class="tab" onclick="changeView('front')">정면</div>
                <div class="tab active" onclick="changeView('side')">측면</div>
                <div class="tab" onclick="changeView('top')">평면</div>
            </div>
            <div class="content-box sim-display">
                <!-- 실제 시뮬레이션이 그려질 캔버스 엘리먼트 -->
                <canvas id="simCanvas"></canvas>
            </div>
        </div>

        <!-- [하단 영역] 화살 및 환경변수 설정창 (스케치대로 좌우 분할) -->
        <div class="control-section">
            
            <!-- 왼쪽: 화살 설정 -->
            <div class="control-group">
                <div class="tab-container">
                    <div class="tab active">화살</div>
                </div>
                <div class="content-box control-content">
                    <div class="form-group">
                        <label>초기 속도 (m/s)</label>
                        <input type="number" id="velocity" value="50">
                    </div>
                    <div class="form-group">
                        <label>발사 각도 (°)</label>
                        <input type="number" id="angle" value="30">
                    </div>
                    <div class="form-group">
                        <label>화살 무게 (g)</label>
                        <input type="number" id="weight" value="25">
                    </div>
                </div>
            </div>

            <!-- 오른쪽: 환경변수 설정 -->
            <div class="control-group">
                <div class="tab-container">
                    <div class="tab active">환경변수</div>
                </div>
                <div class="content-box control-content">
                    <div class="form-group">
                        <label>맞바람/뒷바람 (m/s)</label>
                        <input type="number" id="windX" value="0">
                    </div>
                    <div class="form-group">
                        <label>옆바람 (m/s)</label>
                        <input type="number" id="windY" value="0">
                    </div>
                    <div class="form-group">
                        <label>공기 밀도 (kg/m³)</label>
                        <input type="number" id="airDensity" value="1.225" step="0.001">
                    </div>
                </div>
            </div>

            <!-- 시뮬레이션 실행 버튼 -->
            <button class="fire-btn" onclick="fireArrow()">🏹 화살 발사하기</button>

        </div>

    </div>

    <script>
        // 시점 변경 기능 함수 정의 (추후 카메라 뷰 연동)
        function changeView(viewType) {
            const tabs = document.querySelectorAll('.sim-section .tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // 클릭한 탭 활성화 처리 예시
            if(viewType === 'front') tabs[0].classList.add('active');
            if(viewType === 'side') tabs[1].classList.add('active');
            if(viewType === 'top') tabs[2].classList.add('active');
            
            console.log(viewType + " 시점으로 전환됨");
            // TODO: 여기에 각 시점별로 Canvas 그리기 함수 연결
        }

        function fireArrow() {
            alert("화살이 발사되었습니다! (물리 로직 연결 필요)");
        }
    </script>
</body>
</html>
