<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arrow Trajectory Simulator</title>
<style>
/* 애플 디자인 시스템 기반 초기화 */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
background: #f5f5f7; 
color: #1d1d1f; 
height: 100vh;
overflow: hidden; /* 보텀시트 제어를 위해 전체 스크롤 막음 */
display: flex;
flex-direction: column;
}

/* 메인 화면 레이아웃 */
.main-screen {
flex: 1;
display: flex;
flex-direction: column;
padding: 20px;
padding-bottom: 90px; /* 하단 탭바 영역 확보 */
}

h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 16px; text-align: center; }

/* 세그먼트 컨트롤 시점 선택 */
.segmented-control { 
display: flex; 
background: #e3e3e6; 
padding: 4px; 
border-radius: 9px; 
margin-bottom: 16px;
align-self: center;
width: fit-content;
z-index: 10;
}
.segment-btn { 
border: none; background: none; padding: 6px 20px; font-size: 13px; 
font-weight: 500; color: #515154; border-radius: 7px; cursor: pointer; 
transition: all 0.2s ease;
}
.segment-btn.active { 
background: #ffffff; color: #1d1d1f; box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.12); font-weight: 600;
}

/* 메인 캔버스 영역 */
.sim-container {
flex: 1;
background: #ffffff;
border-radius: 20px;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
border: 1px solid rgba(0, 0, 0, 0.04);
overflow: hidden;
position: relative;
}
canvas { width: 100%; height: 100%; display: block; }

/* 발사 및 제어 고정 버튼 */
.floating-actions {
position: absolute;
bottom: 20px;
right: 20px;
display: flex;
gap: 10px;
}
.fire-btn {
padding: 14px 28px; background: #0071e3; color: #fff; font-size: 15px; 
font-weight: 600; border: none; border-radius: 12px; cursor: pointer; 
box-shadow: 0 4px 12px rgba(0,113,227,0.3); transition: 0.2s;
}
.fire-btn:active { transform: scale(0.97); }

/* --- iOS 스타일 보텀 시트 --- */
.bottom-sheet-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 900;
}
.bottom-sheet-overlay.active { opacity: 1; pointer-events: auto; }

.bottom-sheet {
position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; 
border-radius: 20px 20px 0 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.1); 
transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); z-index: 1000; padding: 20px; 
padding-bottom: 40px;
}
.bottom-sheet.active { transform: translateY(0); }

/* 보텀 시트 상단 손잡이 대시 */
.sheet-handle { width: 40px; height: 5px; background: #ddddde; border-radius: 2.5px; margin: 0 auto 20px auto; cursor: pointer; }

.sheet-title { font-size: 19px; font-weight: 700; margin-bottom: 20px; color: #1d1d1f; }
.form-grid { display: flex; flex-direction: column; gap: 16px; }

/* 애플 스타일 입력 폼 */
.form-group { display: flex; justify-content: space-between; align-items: center; }
.form-group label { font-size: 14px; color: #515154; font-weight: 500; }
.input-wrapper { display: flex; align-items: center; background: #f5f5f7; border-radius: 8px; padding: 8px 12px; border: 1px solid transparent; }
.input-wrapper:focus-within { border-color: #0071e3; background: #fff; box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }
.input-wrapper input { width: 80px; border: none; background: transparent; text-align: right; font-size: 14px; font-weight: 600; outline: none; }
.input-wrapper .unit { font-size: 12px; color: #86868b; margin-left: 6px; width: 40px; }

/* --- 하단 탭 바 (iOS 네비게이션 바 스타일) --- */
.tab-bar {
position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; 
background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); 
-webkit-backdrop-filter: blur(20px); border-top: 0.5px solid rgba(0,0,0,0.15); display: flex; justify-content: space-around; 
align-items: center; padding-bottom: 15px; z-index: 800;
}
.tab-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #86868b; cursor: pointer; font-size: 10px; font-weight: 500; width: 80px; }
.tab-item.active { color: #0071e3; }
.tab-icon { font-size: 20px; }
</style>
</head>
<body>
<!-- 메인 화면 영역 -->
<div class="main-screen">
  <h1>Arrow Trajectory</h1>

  <!-- 시점 토글 세그먼트 -->
  <div class="segmented-control">
    <button class="segment-btn" onclick="changeView('front', this)">정면</button>
    <button class="segment-btn active" onclick="changeView('side', this)">측면</button>
    <button class="segment-btn" onclick="changeView('top', this)">평면</button>
  </div>

  <!-- 시뮬레이터 캔버스 컨테이너 -->
  <div class="sim-container">
    <canvas id="simCanvas"></canvas>

    <!-- 우측 하단 발사 버튼 -->
    <div class="floating-actions">
      <button class="fire-btn" onclick="fireArrow()">🏹 발사</button>
    </div>
  </div>
</div>

<!-- 배경 어둡게 처리용 오버레이 -->
<div class="bottom-sheet-overlay" id="overlay" onclick="closeBottomSheet()"></div>

<!-- [보텀 시트 1] 화살 설정 -->
<div class="bottom-sheet" id="sheet-arrow">
  <div class="sheet-handle" onclick="closeBottomSheet()"></div>
  <div class="sheet-title">화살 설정</div>
  <div class="form-grid">
    <div class="form-group">
      <label>초기 속도</label>
      <div class="input-wrapper">
        <input type="number" id="velocity" value="50">
        <span class="unit">m/s</span>
      </div>
    </div>
    <div class="form-group">
      <label>발사 각도 (수직)</label>
      <div class="input-wrapper">
        <input type="number" id="angle" value="30">
        <span class="unit">°</span>
      </div>
    </div>
    <div class="form-group">
      <label>수평 각도 (방위각)</label>
      <div class="input-wrapper">
        <input type="number" id="yawAngle" value="0">
        <span class="unit">°</span>
      </div>
    </div>
    <div class="form-group">
      <label>발사 높이</label>
      <div class="input-wrapper">
        <input type="number" id="launchHeight" value="1.5" step="0.1">
        <span class="unit">m</span>
      </div>
    </div>
    <div class="form-group">
      <label>화살 직경 (두께)</label>
      <div class="input-wrapper">
        <input type="number" id="diameter" value="5.5" step="0.1">
        <span class="unit">mm</span>
      </div>
    </div>
    <div class="form-group">
      <label>항력 계수 (Cd)</label>
      <div class="input-wrapper">
        <input type="number" id="dragCoeff" value="0.35" step="0.01">
        <span class="unit">cd</span>
      </div>
    </div>
    <div class="form-group">
      <label>양력 계수 (Cl)</label>
      <div class="input-wrapper">
        <input type="number" id="liftCoeff" value="0.05" step="0.01">
        <span class="unit">cl</span>
      </div>
    </div>
    <div class="form-group">
      <label>화살 무게</label>
      <div class="input-wrapper">
        <input type="number" id="weight" value="25">
        <span class="unit">g</span>
      </div>
    </div>
  </div>
</div>

<!-- [보텀 시트 2] 환경 변수 -->
<div class="bottom-sheet" id="sheet-env">
  <div class="sheet-handle" onclick="closeBottomSheet()"></div>
  <div class="sheet-title">환경 변수 설정</div>
  <div class="form-grid">
    <div class="form-group">
      <label>과녁 높이</label>
      <div class="input-wrapper">
        <input type="number" id="targetHeight" value="1.3" step="0.1">
        <span class="unit">m</span>
      </div>
    </div>
    <div class="form-group">
      <label>종풍 (맞바람/뒷바람)</label>
      <div class="input-wrapper">
        <input type="number" id="windX" value="0">
        <span class="unit">m/s</span>
      </div>
    </div>
    <div class="form-group">
      <label>횡풍 (옆바람)</label>
      <div class="input-wrapper">
        <input type="number" id="windY" value="0">
        <span class="unit">m/s</span>
      </div>
    </div>
    <div class="form-group">
      <label>공기 밀도</label>
      <div class="input-wrapper">
        <input type="number" id="airDensity" value="1.225" step="0.001">
        <span class="unit">kg/m³</span>
      </div>
    </div>
  </div>
</div>

<!-- 하단 탭바 메뉴 내비게이션 -->
<div class="tab-bar">
  <button class="tab-item" onclick="openBottomSheet('arrow')">
    <span class="tab-icon">🏹</span>
    <span>화살 설정</span>
  </button>
  <button class="tab-item" onclick="openBottomSheet('env')">
    <span class="tab-icon">🌍</span>
    <span>환경 변수</span>
  </button>
</div>
<script>
// Canvas 설정 및 컨텍스트 확보
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', resizeCanvas);

// 보텀 시트 제어 로직
function openBottomSheet(type) {
    closeBottomSheet();
    document.getElementById('overlay').classList.add('active');
    if(type === 'arrow') {
        document.getElementById('sheet-arrow').classList.add('active');
    } else if(type === 'env') {
        document.getElementById('sheet-env').classList.add('active');
    }
}

function closeBottomSheet() {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('sheet-arrow').classList.remove('active');
    document.getElementById('sheet-env').classList.remove('active');
}

// 시점 변경 제어
let currentView = 'side';
function changeView(viewType, element) {
    const buttons = document.querySelectorAll('.segment-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
    currentView = viewType;
    drawScene();
}

// 실시간 시뮬레이션 상태 변수
let isFlying = false;
let animationFrameId = null;
let trajectory = [];

let arrowState = {
    x: 0, y: 0, z: 0,
    vx: 0, vy: 0, vz: 0,
    pitch: 0, yaw: 0
};

const SCALE = 10; // 1m = 10px
const GROUND_Y_OFFSET = 50;

function fireArrow() {
    if (isFlying) cancelAnimationFrame(animationFrameId);

    const v0 = parseFloat(document.getElementById('velocity').value);
    const angleDeg = parseFloat(document.getElementById('angle').value);     // 수직각
    const yawDeg = parseFloat(document.getElementById('yawAngle').value);     // 수평각
    const launchH = parseFloat(document.getElementById('launchHeight').value); // 발사높이

    const pitchRad = (angleDeg * Math.PI) / 180;
    const yawRad = (yawDeg * Math.PI) / 180;

    // 3차원 위치 및 초기 속도 벡터 성분 분해
    arrowState.x = 20 / SCALE;
    arrowState.y = launchH;
    arrowState.z = 0;

    arrowState.vx = v0 * Math.cos(pitchRad) * Math.cos(yawRad);
    arrowState.vy = v0 * Math.sin(pitchRad);
    arrowState.vz = v0 * Math.cos(pitchRad) * Math.sin(yawRad);
    
    arrowState.pitch = pitchRad;
    arrowState.yaw = yawRad;

    trajectory = [];
    isFlying = true;
    animate();
}

function animate() {
    if (!isFlying) return;

    // 폼에서 실시간 동적 값 취득
    const cd = parseFloat(document.getElementById('dragCoeff').value);
    const cl = parseFloat(document.getElementById('liftCoeff').value);
    const d = parseFloat(document.getElementById('diameter').value) / 1000;
    const m = parseFloat(document.getElementById('weight').value) / 1000;
    const rho = parseFloat(document.getElementById('airDensity').value);
    const windX = parseFloat(document.getElementById('windX').value);
    const windY = parseFloat(document.getElementById('windY').value); // 횡풍 (z축 매핑)

    const g = 9.81;
    const dt = 0.016;

    const area = Math.PI * Math.pow(d / 2, 2);

    // 바람 대비 상대 속도 계산
    const relVx = arrowState.vx - windX;
    const relVy = arrowState.vy;
    const relVz = arrowState.vz - windY;
    const vRel = Math.sqrt(relVx * relVx + relVy * relVy + relVz * relVz);

    // 공기역학 항력 및 양력 연산
    const dragF = 0.5 * rho * vRel * vRel * cd * area;
    const liftF = 0.5 * rho * vRel * vRel * cl * area;

    const flowPitch = Math.atan2(relVy, Math.sqrt(relVx * relVx + relVz * relVz));
    const flowYaw = Math.atan2(relVz, relVx);

    // 가속도 계산 (F = ma)
    const ax = (-dragF * Math.cos(flowPitch) * Math.cos(flowYaw) - liftF * Math.sin(flowPitch) * Math.cos(flowYaw)) / m;
    const ay = (-g - dragF * Math.sin(flowPitch) + liftF * Math.cos(flowPitch)) / m;
    const az = (-dragF * Math.cos(flowPitch) * Math.sin(flowYaw) - liftF * Math.sin(flowPitch) * Math.sin(flowYaw)) / m;

    arrowState.vx += ax * dt;
    arrowState.vy += ay * dt;
    arrowState.vz += az * dt;

    arrowState.x += arrowState.vx * dt;
    arrowState.y += arrowState.vy * dt;
    arrowState.z += arrowState.vz * dt;

    arrowState.pitch = Math.atan2(arrowState.vy, Math.sqrt(arrowState.vx * arrowState.vx + arrowState.vz * arrowState.vz));
    arrowState.yaw = Math.atan2(arrowState.vz, arrowState.vx);

    trajectory.push({x: arrowState.x, y: arrowState.y, z: arrowState.z});

    if (arrowState.y <= 0) {
        arrowState.y = 0;
        isFlying = false;
    }

    drawScene();

    if (isFlying) {
        animationFrameId = requestAnimationFrame(animate);
    }
}

function drawScene() {
    const viewWidth = canvas.width / window.devicePixelRatio;
    const viewHeight = canvas.height / window.devicePixelRatio;
    ctx.clearRect(0, 0, viewWidth, viewHeight);

    const targetH = parseFloat(document.getElementById('targetHeight').value);
    const targetX = viewWidth - 60;

    // 시점에 따른 2D 변환 헬퍼 함수 정의
    function getScreenCoords(pX, pY, pZ) {
        if (currentView === 'side') { // 측면 뷰 (X, Y 조합)
            return { x: pX * SCALE, y: viewHeight - GROUND_Y_OFFSET - (pY * SCALE) };
        } else if (currentView === 'top') { // 평면 뷰 (X, Z 조합)
            return { x: pX * SCALE, y: (viewHeight / 2) + (pZ * SCALE) };
        } else { // 정면 뷰 (Z, Y 조합)
            return { x: (viewWidth / 2) + (pZ * SCALE), y: viewHeight - GROUND_Y_OFFSET - (pY * SCALE) };
        }
    }

    // 1. 바닥선 또는 가이드선 시트 그리기
    ctx.strokeStyle = '#86868b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (currentView === 'side' || currentView === 'front') {
        const groundY = viewHeight - GROUND_Y_OFFSET;
        ctx.moveTo(0, groundY); ctx.lineTo(viewWidth, groundY);
    } else {
        ctx.moveTo(0, viewHeight / 2); ctx.lineTo(viewWidth, viewHeight / 2);
    }
    ctx.stroke();

    // 2. 과녁 그리기
    const tgtPos = getScreenCoords(targetX / SCALE, targetH, 0);
    ctx.fillStyle = '#ff3b30';
    ctx.beginPath(); ctx.arc(tgtPos.x, tgtPos.y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(tgtPos.x, tgtPos.y, 6, 0, Math.PI * 2); ctx.fill();

    // 3. 누적 비행 궤적 그리기
    if (trajectory.length > 1) {
        ctx.strokeStyle = '#0071e3';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        const startPos = getScreenCoords(trajectory[0].x, trajectory[0].y, trajectory[0].z);
        ctx.moveTo(startPos.x, startPos.y);
        for (let i = 1; i < trajectory.length; i++) {
            const pos = getScreenCoords(trajectory[i].x, trajectory[i].y, trajectory[i].z);
            ctx.lineTo(pos.x, pos.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // 4. 실시간 화살 투영 객체 그리기
    const arrowPos = getScreenCoords(arrowState.x, arrowState.y, arrowState.z);
    ctx.save();
    ctx.translate(arrowPos.x, arrowPos.y);

    let renderAngle = 0;
    if (currentView === 'side') renderAngle = -arrowState.pitch;
    else if (currentView === 'top') renderAngle = arrowState.yaw;
    else renderAngle = 0; 
    ctx.rotate(renderAngle);

    ctx.strokeStyle = '#515154'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(0, 0); ctx.stroke();

    ctx.fillStyle = '#1d1d1f';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-6, -3); ctx.lineTo(-6, 3); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#ff9500';
    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-16, -4); ctx.lineTo(-10, -4); ctx.lineTo(-14, 0); ctx.fill();
    ctx.restore();
}

setTimeout(() => {
    const launchH = parseFloat(document.getElementById('launchHeight').value);
    arrowState.x = 20 / SCALE; arrowState.y = launchH; arrowState.z = 0;
    arrowState.pitch = (parseFloat(document.getElementById('angle').value) * Math.PI) / 180;
    arrowState.yaw = (parseFloat(document.getElementById('yawAngle').value) * Math.PI) / 180;
    drawScene();
}, 200);
</script>
</body>
</html>
