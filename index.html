<!-- [Part 1: UI HTML 레이아웃 및 프리미엄 비주얼 CSS 스타일 정의] -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jumong-jeong - Gungdo Simulator</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://cdnfonts.com');
        
        :root {
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif !important;
            background-color: #0A0A0C !important;
            color: #E0E0E3 !important;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        sidebar {
            width: 320px;
            background: rgba(15, 15, 20, 0.7);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
        }

        main {
            margin-left: 320px;
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h1, h2, h3 {
            letter-spacing: -0.03em;
        }

        h1 {
            font-weight: 800;
            font-size: 28px;
            text-align: center;
            margin-bottom: 10px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-section h2 {
            font-size: 16px;
            color: #FFFFFF;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            margin-top: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: #A9A9B3;
        }

        input[type="number"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            color: #FFFFFF;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #00FFCC;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #00FFCC;
        }

        .slider-val {
            font-size: 13px;
            color: #FFFFFF;
            width: 45px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .crystal-panel {
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(20px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 16px !important;
            padding: 24px !important;
            position: relative;
        }

        .dashboard-header {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 24px;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums !important;
        }

        .perfect-level {
            color: #00FFCC !important;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.8), 0 0 24px rgba(0, 255, 204, 0.4) !important;
            font-weight: 800 !important;
        }

        .recording {
            color: #FF3366 !important;
            text-shadow: 0 0 12px rgba(255, 51, 102, 0.8), 0 0 24px rgba(255, 51, 102, 0.4) !important;
            font-weight: 800 !important;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .chart-box {
            height: 260px;
            position: relative;
        }

        #windCanvas {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.01);
        }
    </style>
</head>
<body>

<sidebar>
    <h1>🏹 JUMONG-JEONG</h1>
    <div style="text-align: center; font-size: 11px; color: rgba(255,255,255,0.3); margin-top: -15px; margin-bottom: 10px;">朱蒙亭 Simulation</div>
    
    <div class="sidebar-section">
        <h2>⚙️ Launcher Specs</h2>
        <div class="input-group">
            <label>Velocity (m/s)</label>
            <input type="number" id="v0" value="60" min="30" max="100" step="1">
        </div>
        <div class="input-group">
            <label>Weight (g)</label>
            <input type="number" id="m_g" value="26.25" min="15" max="40" step="0.05">
        </div>
        <div class="input-group">
            <label>Diameter (mm)</label>
            <input type="number" id="d_mm" value="8.0" min="5" max="15" step="0.1">
        </div>
        <div class="input-group">
            <label>Vertical Angle (°)</label>
            <input type="number" id="theta_deg" value="13.0" min="0" max="45" step="0.1">
        </div>
        <div class="input-group">
            <label>Horizontal Angle (°)</label>
            <input type="number" id="phi_deg" value="-0.5" min="-5" max="5" step="0.1">
        </div>
        <div class="input-group">
            <label>Release Height (m)</label>
            <input type="number" id="h0" value="1.5" min="0" max="5" step="0.1">
        </div>
    </div>

    <div class="sidebar-section">
        <h2>🧪 Aero Environment</h2>
        <div class="input-group">
            <label>Drag Coeff (Cd)</label>
            <div class="slider-container">
                <input type="range" id="cd0" min="0.1" max="1.5" step="0.05" value="0.9">
                <span class="slider-val" id="cd0_val">0.9</span>
            </div>
        </div>
        <div class="input-group">
            <label>Lift Coeff (Cl)</label>
            <div class="slider-container">
                <input type="range" id="cl0" min="0.0" max="0.5" step="0.01" value="0.05">
                <span class="slider-val" id="cl0_val">0.05</span>
            </div>
        </div>
        <div class="input-group">
            <label>Tail(+) / Head(-) Wind (m/s)</label>
            <div class="slider-container">
                <input type="range" id="wx" min="-15" max="15" step="0.5" value="11">
                <span class="slider-val" id="wx_val">11</span>
            </div>
        </div>
        <div class="input-group">
            <label>Cross Wind (L:-, R:+) (m/s)</label>
            <div class="slider-container">
                <input type="range" id="wz" min="-10" max="10" step="0.5" value="8">
                <span class="slider-val" id="wz_val">8</span>
            </div>
        </div>
        <div class="input-group">
            <label>Target Relative Height (m)</label>
            <input type="number" id="target_dh" value="2.0" min="-10" max="10" step="0.5">
        </div>
    </div>
</sidebar>
<!-- [Part 2: 대시보드 구조 및 정밀 물리 수치해석 핵심 엔진 스크립트] -->
<main>
    <div class="dashboard-header">
        <div class="crystal-panel" style="display: flex; justify-content: center; align-items: center; padding: 10px !important;">
            <canvas id="windCanvas" width="110" height="110"></canvas>
        </div>
        <div class="crystal-panel" id="resultPanel" style="border-left: 5px solid #FF3366;"></div>
    </div>

    <div class="canvas-container">
        <div class="crystal-panel chart-box">
            <canvas id="sideViewChart"></canvas>
        </div>
        <div class="crystal-panel chart-box">
            <canvas id="topViewChart"></canvas>
        </div>
        <div class="crystal-panel style-canvas" style="display: flex; justify-content: center; background: rgba(255,255,255,0.02);">
            <div style="width: 100%; max-width: 500px; height: 320px;">
                <canvas id="frontViewChart"></canvas>
            </div>
        </div>
    </div>

    <div class="crystal-panel" style="padding: 12px 24px !important; text-align: center; font-size: 13px; color: #8A8A93;">
        <span class="tabular-nums">🏹 Arrow Specification Matrix: <b id="bannerSpecs">26.25g</b></span> 
        <span style="margin: 0 15px; color: rgba(255,255,255,0.1);">|</span> 
        <span>v1.8.0 (GitHub Static Engine)</span>
    </div>
</main>

<script>
    const sliders = ['cd0', 'cl0', 'wx', 'wz'];
    sliders.forEach(id => {
        const input = document.getElementById(id);
        const valSpan = document.getElementById(id + '_val');
        input.addEventListener('input', () => {
            valSpan.textContent = input.value;
            runSimulation();
        });
    });

    const inputs = ['v0', 'm_g', 'd_mm', 'theta_deg', 'phi_deg', 'h0', 'target_dh'];
    inputs.forEach(id => {
        document.getElementById(id).addEventListener('change', runSimulation);
    });

    let sideChart = null;
    let topChart = null;
    let frontChart = null;

    function simulate(v0, m_g, d_mm, theta_deg, phi_deg, h0, target_dh, wx, wz, cd0, cl0) {
        const m = m_g / 1000.0;
        const d = d_mm / 1000.0;
        const g = 9.80665;
        const rho = 1.225;
        const dt = 0.01;
        
        const theta = theta_deg * Math.PI / 180.0;
        const phi = phi_deg * Math.PI / 180.0;
        const A = Math.PI * Math.pow(d / 2.0, 2);
        
        let vx = v0 * Math.cos(theta) * Math.cos(phi);
        let vy = v0 * Math.sin(theta);
        let vz = v0 * Math.cos(theta) * Math.sin(phi);
        
        let x = 0.0, y = h0, z = 0.0;
        
        let xs = [x], ys = [y], zs = [z];
        let maxSteps = 5000;
        
        while (y >= (target_dh - 5.0) && x <= 165.0 && maxSteps > 0) {
            maxSteps--;
            let vrx = vx - wx;
            let vry = vy;
            let vrz = vz - wz;
            let v = Math.sqrt(vrx*vrx + vry*vry + vrz*vrz);
            if (v < 1e-6) break;
            
            let Fd = 0.5 * rho * (cd0 * (1 + 0.15 * Math.pow(v / 60.0, 2))) * A * v*v;
            let Fl = 0.5 * rho * cl0 * A * v*v;
            
            let ax = -Fd * vrx / (m * v);
            let az = -Fd * vrz / (m * v);
            let ay = -g - (Fd * vry / (m * v)) + (Fl / m);
            
            vx += ax * dt; vy += ay * dt; vz += az * dt;
            x += vx * dt; y += vy * dt; z += vz * dt;
            
            xs.push(x); ys.push(y); zs.push(z);
        }
        return { xs, ys, zs };
    }
</script>
<!-- [Part 3: 실시간 조준 연산 판정 및 3축 가독성 뷰 Chart.js 인터페이스 렌더링 스크립트 완료] -->
<script>
    function drawWindVector(wx, wz) {
        const canvas = document.getElementById('windCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const r = 45;
        
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI); ctx.stroke();
        
        const norm = Math.sqrt(wx*wx + wz*wz);
        if (norm > 0) {
            const nx = wx / norm;
            const nz = wz / norm;
            
            ctx.strokeStyle = '#00FFCC';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + nx * r * 0.8, cy - nz * r * 0.8);
            ctx.stroke();
            
            ctx.fillStyle = '#00FFCC';
            ctx.beginPath();
            ctx.arc(cx + nx * r * 0.8, cy - nz * r * 0.8, 4, 0, 2*Math.PI);
            ctx.fill();
        }
    }

    function runSimulation() {
        const v0 = parseFloat(document.getElementById('v0').value);
        const m_g = parseFloat(document.getElementById('m_g').value);
        const d_mm = parseFloat(document.getElementById('d_mm').value);
        const theta_deg = parseFloat(document.getElementById('theta_deg').value);
        const phi_deg = parseFloat(document.getElementById('phi_deg').value);
        const h0 = parseFloat(document.getElementById('h0').value);
        const cd0 = parseFloat(document.getElementById('cd0').value);
        const cl0 = parseFloat(document.getElementById('cl0').value);
        const wx = parseFloat(document.getElementById('wx').value);
        const wz = parseFloat(document.getElementById('wz').value);
        const target_dh = parseFloat(document.getElementById('target_dh').value);

        document.getElementById('bannerSpecs').textContent = `${m_g}g Weight | Diameter ${d_mm}mm`;
        drawWindVector(wx, wz);

        const { xs, ys, zs } = simulate(v0, m_g, d_mm, theta_deg, phi_deg, h0, target_dh, wx, wz, cd0, cl0);

        const t_base = 145.0, t_h = 2.67, t_w = 2.0, tilt = 15 * Math.PI / 180.0;
        let hit_data = { y: ys[ys.length-1], z: zs[zs.length-1], hit: false };
        
        for (let i = 0; i < xs.length - 1; i++) {
            let tx = t_base + (ys[i] - target_dh) * Math.tan(tilt);
            if (xs[i] <= tx && tx <= xs[i+1]) {
                let ay = (ys[i] - target_dh) / Math.cos(tilt);
                hit_data = { y: ay, z: zs[i], hit: (ay >= 0 && ay <= t_h && Math.abs(zs[i]) <= t_w / 2) };
                break;
            }
        }

        const resultPanel = document.getElementById('resultPanel');
        if (hit_data.hit) {
            resultPanel.style.borderLeftColor = '#00FFCC';
            resultPanel.innerHTML = `
                <span style="font-size:12px; color:#A9A9B3; text-transform:uppercase; letter-spacing:0.1em;">Simulation Result</span>
                <h2 class="perfect-level" style="margin:4px 0 6px 0; font-size:28px;">🎯 HIT (관중)</h2>
                <p class="tabular-nums" style="font-size:14px; color:#E0E0E3;">Impact Node &rarr; Height: <b>${hit_data.y.toFixed(2)}m</b> | Lateral: <b>${hit_data.z.toFixed(2)}m</b></p>
            `;
        } else {
            resultPanel.style.borderLeftColor = '#FF3366';
            resultPanel.innerHTML = `
                <span style="font-size:12px; color:#A9A9B3; text-transform:uppercase; letter-spacing:0.1em;">Simulation Result</span>
                <h2 class="recording" style="margin:4px 0 6px 0; font-size:28px;">❌ MISS (불관중)</h2>
                <p class="tabular-nums" style="font-size:14px; color:#E0E0E3;">Terminal Node &rarr; Height: <b>${hit_data.y.toFixed(2)}m</b> | Lateral: <b>${hit_data.z.toFixed(2)}m</b></p>
            `;
        }

        if (sideChart) sideChart.destroy();
        const sideData = xs.map((x, idx) => ({ x: x, y: ys[idx] }));
        sideChart = new Chart(document.getElementById('sideViewChart').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Arrow Path', data: sideData, borderColor: '#00FFCC', borderWidth: 2, pointRadius: 0, fill: false
                }, {
                    label: 'Target Area', data: [{x: t_base, y: target_dh}, {x: t_base + t_h*Math.sin(tilt), y: target_dh + t_h*Math.cos(tilt)}],
                    borderColor: '#FF3366', borderWidth: 4, pointRadius: 0, fill: false
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, title: { display: true, text: 'Flight Trajectory (Side View)', color: '#FFF' } },
                scales: { x: { type: 'linear', grid: { color: 'rgba(255,255,255,0.03)' } }, y: { min: -2, grid: { color: 'rgba(255,255,255,0.03)' } } }
            }
        });

        if (topChart) topChart.destroy();
        const topData = xs.map((x, idx) => ({ x: x, y: zs[idx] }));
        topChart = new Chart(document.getElementById('topViewChart').getContext('2d'), {
            type: 'line',
            data: { datasets: [{ data: topData, borderColor: '#FF9900', borderWidth: 2, pointRadius: 0, fill: false }] },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, title: { display: true, text: 'Flight Path (Top View)', color: '#FFF' } },
                scales: { x: { type: 'linear', grid: { color: 'rgba(255,255,255,0.03)' } }, y: { min: -4, max: 4, reverse: true, grid: { color: 'rgba(255,255,255,0.03)' } } }
            }
        });

        if (frontChart) frontChart.destroy();
        frontChart = new Chart(document.getElementById('frontViewChart').getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Impact Point', data: [{ x: hit_data.z, y: hit_data.y }],
                    backgroundColor: hit_data.hit ? '#00FFCC' : '#FF3366', radius: 7, pointStyle: hit_data.hit ? 'circle' : 'crossRot'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }, title: { display: true, text: 'Impact Analysis (Front View)', color: '#FFF' },
                    beforeDraw: (chart) => {
                        const ctx = chart.ctx;
                        const xAxis = chart.scales.x;
                        const yAxis = chart.scales.y;
                        const xLeft = xAxis.getPixelForValue(-1.0);
                        const xRight = xAxis.getPixelForValue(1.0);
                        const yBottom = yAxis.getPixelForValue(0);
                        const yTop = yAxis.getPixelForValue(2.67);
                        ctx.save();
                        ctx.fillStyle = 'rgba(255, 51, 102, 0.05)';
                        ctx.strokeStyle = '#FF3366';
                        ctx.lineWidth = 2;
                        ctx.fillRect(xLeft, yTop, xRight - xLeft, yBottom - yTop);
                        ctx.strokeRect(xLeft, yTop, xRight - xLeft, yBottom - yTop);
                        ctx.restore();
                    }
                },
                scales: { x: { min: -2.5, max: 2.5, grid: { color: 'rgba(255,255,255,0.03)' } }, y: { min: -0.5, max: 3.5, grid: { color: 'rgba(255,255,255,0.03)' } } }
            }
        });
    }

    window.addEventListener('DOMContentLoaded', runSimulation);
</script>
</body>
</html>
