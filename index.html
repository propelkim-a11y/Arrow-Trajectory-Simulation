<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arrow Trajectory Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 60% : 상단 영역 메인 스크린 및 시뮬레이터 캔버스 -->
  <div class="main-screen">
    <h1>Arrow Trajectory</h1>
    
    <div class="segmented-control">
      <button class="segment-btn" onclick="changeView('front', this)">정면</button>
      <button class="segment-btn active" onclick="changeView('side', this)">측면</button>
      <button class="segment-btn" onclick="changeView('top', this)">평면</button>
      <button class="segment-btn" onclick="changeView('target', this)">과녁</button>
    </div>
    
    <div class="sim-container">
      <canvas id="simCanvas"></canvas>
      <button id="draggableFireBtn" class="fire-btn">발사</button>
    </div>
  </div>
  
  <!-- 40% : 하단 영역 라운드 카드형 설정 및 결과 패널 컨테이너 -->
  <div id="panel-container">
  
    <!-- 탭 화살 설정 -->
    <div class="fixed-panel active" id="panel-arrow">
      <div class="panel-card">
        <div class="panel-title">화살 설정</div>
        <div class="form-grid">
          <div class="form-group">
            <label>화살 무게</label>
            <div class="input-wrapper">
              <input type="number" id="weight" value="25"><span class="unit">g</span>
            </div>
          </div>
          <div class="form-group">
            <label>화살 직경</label>
            <div class="input-wrapper">
              <input type="number" id="diameter" value="5.5" step="0.1"><span class="unit">mm</span>
            </div>
          </div>
          <div class="form-group">
            <label>항력 계수</label>
            <div class="input-wrapper">
              <input type="number" id="dragCoeff" value="0.35" step="0.01"><span class="unit">cd</span>
            </div>
          </div>
          <div class="form-group">
            <label>양력 계수</label>
            <div class="input-wrapper">
              <input type="number" id="liftCoeff" value="0.05" step="0.01"><span class="unit">cl</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 탭 사법 설정 -->
    <div class="fixed-panel" id="panel-method">
      <div class="panel-card">
        <div class="panel-title">사법 설정</div>
        <div class="form-grid">
          <div class="form-group">
            <label>발시 각도</label>
            <div class="input-wrapper">
              <input type="text" id="angle" value="30" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
              <span class="unit">°</span>
            </div>
          </div>
          <div class="form-group">
            <label>초기 속도</label>
            <div class="input-wrapper">
              <input type="number" id="velocity" value="50"><span class="unit">m/s</span>
            </div>
          </div>
          <div class="form-group">
            <label>수평 각도</label>
            <div class="input-wrapper">
              <input type="text" id="yawAngle" value="0" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
              <span class="unit">°</span>
            </div>
          </div>
          <div class="form-group">
            <label>발시 높이</label>
            <div class="input-wrapper">
              <input type="number" id="launchHeight" value="1.5" step="0.1"><span class="unit">m</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 탭 환경 설정 -->
    <div class="fixed-panel" id="panel-env">
      <div class="panel-card">
        <div class="panel-title">환경 설정</div>
        <div class="form-grid">
          <div class="form-group">
            <label>종풍</label>
            <div class="input-wrapper">
              <input type="text" id="windX" value="0" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
              <span class="unit">m/s</span>
            </div>
          </div>
          <div class="form-group">
            <label>횡풍</label>
            <div class="input-wrapper">
              <input type="text" id="windY" value="0" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
              <span class="unit">m/s</span>
            </div>
          </div>
          <div class="form-group">
            <label>과녁 고도차</label>
            <div class="input-wrapper">
              <input type="text" id="targetHeight" value="1.3" inputmode="text" pattern="^-?[0-9]*\.?[0-9]*$">
              <span class="unit">m</span>
            </div>
          </div>
          <div class="form-group">
            <label>공기 밀도</label>
            <div class="input-wrapper">
              <input type="number" id="airDensity" value="1.225" step="0.001"><span class="unit">kg/m³</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 탭 비행 결과 -->
    <div class="fixed-panel" id="panel-result">
      <div class="panel-card">
        <div class="panel-title">비행 결과 분석</div>
        <div class="form-grid">
          <div class="form-group"><label>최대 거리</label><div class="result-value" id="resMaxDist">0.00 m</div></div>
          <div class="form-group"><label>최대 높이</label><div class="result-value" id="resMaxHeight">0.00 m</div></div>
          <div class="form-group"><label>측면 편차</label><div class="result-value" id="resSideDev">0.00 m</div></div>
          <div class="form-group"><label>비행 시간</label><div class="result-value" id="resFlightTime">0.00 s</div></div>
          <div class="form-group"><label>충돌 속도</label><div class="result-value" id="resImpactVel">0.00 m/s</div></div>
          <div class="form-group"><label>충돌 에너지</label><div class="result-value" id="resImpactEnergy">0.00 J</div></div>
        </div>
      </div>
    </div>
  
  </div>
  
  <!-- 맨 아래 고정된 저작권 표시 영역 및 조회수 카운터 컨테이너 -->
  <div id="app-copyright">
    <div>Copyright © 2026 - . All Rights Reserved. 해현 활터왔소</div>
    <div id="hits-counter-container" style="margin-top: 5px; display: flex; justify-content: center; align-items: center;"></div>
  </div>
  
  <!-- 맨 하단 메뉴 전환 탭바 -->
  <div class="tab-bar">
    <button class="tab-item active" onclick="switchPanel('arrow')"><span class="tab-icon">🎯</span><span>화살 설정</span></button>
    <button class="tab-item" onclick="switchPanel('method')"><span class="tab-icon">🏹</span><span>사법 설정</span></button>
    <button class="tab-item" onclick="switchPanel('env')"><span class="tab-icon">🐓</span><span>환경 설정</span></button>
    <button class="tab-item" onclick="switchPanel('result')"><span class="tab-icon">📊</span><span>비행 결과</span></button>
  </div>

  <!-- 무조건 로딩 성공하는 고안정성 카운터 스크립트 -->
  <script>
    (function() {
      // 깃허브 배포 주소의 메인 도메인명 식별 정보 활용
      const user = "propelkim-a11y";
      const repo = "Arrow-Trajectory-Simulation";

      // GitHub 관련 트래픽 분석에 최적화된 고안정성 글로벌 무상 이미지 배지 엔드포인트
      const badgeSrc = `https://shields.io{user}/${repo}?color=79C83D&label=views&style=flat-square`;

      // 텍스트 중복 제거 후 깔끔하고 간결하게 배지만 렌더링하도록 마크업 재구성
      const counterHtml = `
        <a href="https://github.com{user}/${repo}" target="_blank" rel="noopener noreferrer" style="display: flex; height: 18px; align-items: center;">
          <img src="${badgeSrc}" alt="Views Counter" style="height: 100%; display: block;" />
        </a>
      `;

      const container = document.getElementById('hits-counter-container');
      if (container) {
        container.innerHTML = counterHtml;
      }
    })();
  </script>

  <script src="ui.js"></script>
  <script src="physics.js"></script>
</body>
</html>
